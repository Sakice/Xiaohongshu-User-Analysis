            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

\u003eScore: 0\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Wait. Aren\u2019t conservatives against refugees? Now they are some.\n        \u003c/div\u003e\n        "}, {"color": "#dfcb08", "id": "1377", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            I will log on and spam: nihao bing chilling\n        \u003c/div\u003e\n        "}, {"color": "#bbbc70", "id": "3331", "label": "Score: 4", "shape": "dot", "size": 30.4, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 4\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Phrasings on this suck though. It\u2019s not about dismissing opinions simply because they don\u2019t come from the \u201cright\u201d sources, it\u2019s about reading everything so you can see the whole picture clearly and coming to your own conclusions. Seek out opposing articles that stick to posting verifiable facts, it isn\u2019t hard since you can spin and frame the same data points either way, but by doing so the truth between the articles becomes apparent.\n\nLimiting yourself strictly to \u201ctrusted\u201d sources puts you in a similar bubble as conservatives with Fox. Both are formed by rejecting opposing information and viewpoints and sticking only to those who share your beliefs.\n        \u003c/div\u003e\n        "}, {"color": "#4f9b82", "id": "3029", "label": "Score: 6", "shape": "dot", "size": 30.6, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 6\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            You haven\u0027t been on social media long if you think censorship is a unique experience...its on literally every platform\n        \u003c/div\u003e\n        "}, {"color": "#8f70cf", "id": "2719", "label": "Score: 33", "shape": "dot", "size": 33.3, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 33\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            I know exactly what video this is\n        \u003c/div\u003e\n        "}, {"color": "#c4384c", "id": "339", "label": "Score: 0", "shape": "dot", "size": 30.0, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 0\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            China is far more fascist than the US government tho\n        \u003c/div\u003e\n        "}, {"color": "#bbf9aa", "id": "2582", "label": "Score: -15", "shape": "dot", "size": 28.5, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -15\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            It\u0027s a movie set in the universe of Mr robot. I haven\u0027t seen the movie but it\u0027s quite a dystopian TV show.\u00a0\n        \u003c/div\u003e\n        "}, {"color": "#99e77f", "id": "685", "label": "Score: -1", "shape": "dot", "size": 29.9, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Addiction it\u0027s not complex thoughts\n        \u003c/div\u003e\n        "}, {"color": "#4c1706", "id": "2321", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            U guys should just use Douyin\n        \u003c/div\u003e\n        "}, {"color": "#fcac39", "id": "882", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Feel good. You will finally taste hardcore censorship as we Chinese always do suck as account ban, also comment restrictions, limiting views/engagement, shadow bans, and muting - I\u0027m glad to see now Americans finally got a chance to get some clue what freedom of speech means.\n        \u003c/div\u003e\n        "}, {"color": "#942574", "id": "123", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            As a Chinese person, I\u0027ve noticed something interesting lately: After many Americans switched from TikTok to Rednote, they started sharing various difficulties in their lives, like healthcare issues or long working hours (I\u0027m not sure if it\u0027s all true, especially about the working hours - I find it hard to believe that working 10+ hours daily is the norm for you guys).\n\nHonestly, this worries me. Because I see some people in China looking at these posts and saying \"See? Americans don\u0027t have it so great either\" and \"We\u0027re so fortunate to have our strong motherland,\" and then they start caring less about their own problems. The CCP has used similar tactics many times, confusing the focus to blur Chinese people\u0027s perception of their own reality. I don\u0027t think these comparisons are healthy, and they might even be intentionally guided - think about it, is it normal for so many people to suddenly switch platforms like this?\n\nIf you really want to engage in dialogue with us, I hope it can be two-way. There are many issues in China that I hope you\u0027ll pay attention to, including: organ trafficking, rising unemployment, food safety issues, unequal distribution of medical resources, politicization of education, and lack of free speech under totalitarian rule. Many people are being sent to mental hospitals just for speaking out, and they\u0027re only released after being tortured to the point of actual mental breakdown.\n\nI hope this window of communication becomes an opportunity for real dialogue, rather than just another tool for CCP\u0027s political propaganda.\n        \u003c/div\u003e\n        "}]);
