            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

x-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Seeing how American hospitals sell visitor data to Facebook, your phone camera and microphone are constantly recording you (Apple literally just settled a case for this and installed an AI to keep doing it on all their mobile devices), Facebook was literally designed originally to scrape data, and yes all this data is being sold by the companies collecting it, all anyone is doing by joining RedNote is cutting out the middle man.\n\nIf this was about data security, we would be making data security laws. The Tik Tok ban is about controlling speech to maintain the status quo. To keep this at a reasonable length, American Exceptionalism, American Misogyny, and American Racism have collided in a way that causes the cis het white poor people to think they are just displaced millionaires being held back by the brown and/or LGBTQ premium people. The rich then take advantage of this to get the white poor to vote for things that help the rich and hurt the poor. The rich get a few token brown and/or LGBTQ premium folks for propaganda purposes to get the gullible non cis het white poor to vote against their own best interest.    \n  \nWe have also reached the point where there is no real middle class.  You are either the 1% or poor, with few exceptions. We can see this in the housing crisis, where its not that there aren\u0027t houses the need residents, its that no one can afford to rent and buying is somehow more expensive. In how other modern countries are paying pennies on the dollar at the grocery store for food from America compared to American\u0027s buying the exact same product grown in America. In how nationally the birth rate is dropping except when the parents make enough money to afford a child. How many of use have skipped vital medical care because of cost?\n\nThe rich want to maintain this system because it is to their in the moment advantage.  The problem is, we have hit the point where the consequences of short term decision making are coming back on those who made those decision. The decision makers are attempting to offload the responsibility for these consequences off on the American people just like they try to offload all their money problems on the American people. It\u0027s a hard road to walk though because it is very narrow. One misstep and it all comes crashing down.\n\nBanning TikTok is becoming that misstep.\n\n  \nEdit to fix formatting and a duplicate words\n        \u003c/div\u003e\n        "}, {"color": "#57fc93", "id": "1777", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            It also costs money to give birth. Or at least it does if you want to do so safely. That includes [\"natural\" childbirth](https://en.wikipedia.org/wiki/Natural_childbirth) (which is better if no issues occur but can benefit from western medicine if issues do occur or if pain medication is desired, and good hygienic practices of course help) and home births.\n\nAlso, long-term care is terrible in the US. There is often abuse, neglect, and other terrible treatment, not to mention it\u0027s alienating and incredibly expensive.\n        \u003c/div\u003e\n        "}, {"color": "#46d98b", "id": "468", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            This app has not been split into domestic and international versions. American users might find it novel at first, but this sense of novelty won\u2019t last long\u2014unless you decide never to discuss politics for the rest of your life and are determined to always speak positively about the Communist Party.\n\nIf you can\u2019t do that, you\u2019ll soon run into trouble on Xiaohongshu.\n        \u003c/div\u003e\n        "}, {"color": "#bef29d", "id": "805", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            This and to force a sale at a discount to a wealthy supporter\n        \u003c/div\u003e\n        "}, {"color": "#5af476", "id": "469", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            The youth generation of America inadvertently taught the old hags in the congress a valuable lesson\n        \u003c/div\u003e\n        "}, {"color": "#e507b5", "id": "1829", "label": "Score: 11", "shape": "dot", "size": 31.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 11\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Yes\uff0cthey\u0027ve already ruined a perfectly good little corner of the internet. \n\nIt was women-centric\uff0cand most content that was pushed was high-quality. \n\nTurned it on its head within 72 hours\n        \u003c/div\u003e\n        "}, {"color": "#b8f4e6", "id": "1668", "label": "Score: 47", "shape": "dot", "size": 34.7, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 47\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Thank you for saying what needed to be said. The TikTok ban is not now, never was, and never will be about privacy. I\u0027ve seen so many posts in this sub similar to this one, I\u0027m beginning to think they\u0027re just shills, proselytizing. \n\nI don\u0027t usually comment here because I\u0027m still learning about privacy, but it\u0027s scary that people who are supposed to be privacy conscious are not concerned in the least about the real reasons why this app was banned and the implications of that.\n        \u003c/div\u003e\n        "}, {"color": "#db0715", "id": "1462", "label": "Score: -1", "shape": "dot", "size": 29.9, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Again you I\u2019m assuming are not black. Also if you don\u2019t care about people\u2019s opinions or voices your input doesn\u2019t matter. If a white person makes even a joke about Asian people\u2019s eyes the whole community is in an uproar, hell they get mad even when people create brown skin anime which are not even real characters etc so please miss me with the everyone does it.\n        \u003c/div\u003e\n        "}, {"color": "#98d2b6", "id": "790", "label": "Score: 6", "shape": "dot", "size": 30.6, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 6\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            \u003eIt\u0027s not an organic form of protest when before 2 weeks ago the overwhelming majority of people didn\u0027t even know what Rednote was\n\nDefine organic protest. Seems pretty organic to me. Here are the reasons:\n\nTiming wise this come close to the Tiktok ban so there\u0027s natural pressure that\u0027s been building for months.\n\nThere\u0027s been general discontent amongst users that their app they like using is being banned also been building for months.\n\nThere\u0027s an ironic logic in moving from one \"china owned\" app to another which is actually China owned.\n\nOne of the biggest assumptions you\u0027re making is that Rednote was somehow unknown before this. It wasn\u0027t, it was pretty damn big already. Rednote is still incredibly popular at 300 monthly users before current events so its certainly not buried miles deep in the appstore. \n\nPlenty of Chinese people in America use both. \nThey target the same young audience, though rednote skew towards young women.\n\nThere was general discontent towards meta amongst users whom they see as benefiting from the ban so wished to avoid those platforms.\n\nTheres more general discontent towards meta due to the recent announcement that they would be removing fact checkers and DEI programmes sometime shortly before this became viral, a move generally unpopular amongst the young Liberal audience of tiktok.\n\nSpecific viral trends and memes often explode in a matter of days and they\u0027re incredibly difficult to predict and engineer. If it was easy, we\u0027d see viral product adverts all the time I assure you.\n\nMost importantly, it\u0027s novel. To the users they\u0027re both interacting with an audience and users that they haven\u0027t had much exposure to in the past which represents an interest factor other apps don\u0027t offer.\n\n\nSeems like lots of reasons why it\u0027s organic that you\u0027re choosing to ignore.\n        \u003c/div\u003e\n        "}, {"color": "#5f9be8", "id": "612", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            The ccp is gonna have so much blackmail\n        \u003c/div\u003e\n        "}, {"color": "#c997d8", "id": "2154", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Spy vs. Spy\n        \u003c/div\u003e\n        "
