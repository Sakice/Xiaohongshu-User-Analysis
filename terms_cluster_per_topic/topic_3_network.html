            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

hey have with Tiktok if they put in broader laws to regulate algorithms and data collection. The fact that they refuse to do this and instead push to simply ban a single platform purely by virtue of who owns it tells me they don\u0027t actually care about regulating social media at all. \"But China owns it so it\u0027s a national security risk\" is a ridiculous argument when there is zero evidence it\u0027s being used in a subversive way. All the while, Facebook has provably been used to influence the 2016 election (and contributed toward a number of horrific pogroms in India and Myanmar, but hey, they\u0027re not the US so I guess they don\u0027t matter). Now Zuck has decided to weaken hate speech and fact-checking policy of his platforms to make them more in line with X, which is itself owned by the richest man in the world that Zuck is cozying up to and pushed alt-right content like crazy this whole election cycle. \n\nMusk is pushing to be an oligarch and looking set to make life miserable for most of us by cutting government subsidies for the needy and instead of dealing with that, the US government is pointing at Tiktok like \"hey guys that\u0027s run by China, aren\u0027t they reeeaaally scary?\" If this exact situation were happening in China we\u0027d all recognize it as an authoritarian regime pointing the finger at perceived enemies to distract its populace from a shitty unpopular policy decision, but I guess because it\u0027s the American government doing it, we\u0027re all good. Cos it\u0027s not like the American government hasn\u0027t proven itself untrustworthy with keeping peoples\u0027 best interests and data privacy in mind when they make decisions, right?\n        \u003c/div\u003e\n        "}, {"color": "#7d4d57", "id": "3162", "label": "Score: 7", "shape": "dot", "size": 30.7, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 7\u003c/b\u003e\u003cbr\u003e\u tside of your country? Those jobs are just lost and you want to give them away. I assume you are pro-union, but unions can only do so much. There is a certain point where the government needs to step in to prevent foreign influence on its citizens.\n\n\u003e is not being waged on *my* behalf and does not serve *my* interests.\n\nThen go live in China. Countries exist for a reason.\n        \u003c/div\u003e\n        "}, {"color": "#637b4d", "id": "579", "label": "Score: -16", "shape": "dot", "size": 28.4, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -16\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            What is free speech\n        \u003c/div\u003e\n        "}, {"color": "#2a6c3f", "id": "1954", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            All of the Chinese apps are also covered under the TikTok ban bill, although they require an act of the President, which will definitely happen\n        \u003c/div\u003e\n        "}, {"color": "#ce58b4", "id": "292", "label": "Score: 5", "shape": "dot", "size": 30.5, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 5\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            It\u2019s not that we think China is \u201cbenevolent and good\u201d, it\u2019s just that I\u2019m far less worried about some far-off government having my data than I am having it in the hands of Trump/Elon/Zuck.\n        \u003c/div\u003e\n        "}, {"color": "#17648a", "id": "1455", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u00 t anyone who expresses something that can classify as a dissenting point of view gets immidiately disappeared. Run back to your handler, communist dog, maybe they\u0027ll give you a treat for your hard work.\n        \u003c/div\u003e\n        "}, {"color": "#868aff", "id": "1566", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            All social media companies are bad\n\nThe social media company run by a country that wants to see your country taken down about 10 pegs is going to be worse. \n\nBeing mad that your favorite social media company is being told they can\u2019t be directly run by an (almost) enemy foreign government and so you plan to learn that enemy language as some sort of\u2026 revenge? Protest? That\u2019s some Stockholm Syndrome shit. \n\nSeriously folks. Tictok is being told they have to not be directly owned by China if they want to run in the US. This is exactly what China does to every US company that wants to run in China. All China has to do is reform the company as a separate US company under US control. It will come back. It will still be bad for you.  It will be slightly less bad for you as a foreign power isn\u2019t putting their hand on the scale to make sure the social media is hurting you.\n        \u003c/div\u003e\n        "}, {"color": "#6e4c58", "id": "1597", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            This comment is the exact reason why age does not equal intelligence cause this take is a mixture between stupidity and naivety. Homie would ask for solidarity with nazi\u2019s or the Soviet Union with this justification.\n        \u003c/div\u003 Chinese government who have spyware. I prefer American apps which only collect data for nice things, like election interference.\n        \u003c/div\u003e\n        "}, {"color": "#8f22bd", "id": "2354", "label": "Score: 8", "shape": "dot", "size": 30.8, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 8\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Military contracts are a bit different from sharing dances.\n\nAnd if you say \"But they are using personal data\", yeah you outlaw that shit, for everyone.\n\nMicrosoft, Google and Amazon all operate data centers in the US and Europe. Certain EU countries need to isolate the data to certain data centers because of regulations about where data can be stored, to stop the US government from accessing EU citizen data.\n\nEU didn\u0027t just say Microsoft is illegal from operating here now. They said \"Here are the rules, obey them\".\n\nThe one social media that has caused more damage than any other is owned by Meta, so if we are talking about outlawing a company on the basis of spite, it really should be them.\n        \u003c/div\u003e\n        "}, {"color": "#25dea0", "id": "107", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Good point\u00a0\n        \u003c/div\u003e\n        "}, {"color": "#82f9f5", "id": "2169", "label": "Score: 10", "shape": "dot", "size": 31.0, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 10\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            [With the utmost respect to this sub\u2019s community]\n\nPeople are simply tired and apathy has fully set in. They no longer trust the companies they were once told they could rely on, because time and again those companies have shown they don\u2019t truly care about customers\u2019 and users\u2019 data. Whether it\u2019s failing to put proper safeguards in place (leading to breaches) or blatantly selling and trading data with third parties, these organizations have undermined public confidence.\n\nAs a result, many people feel their information is already \u201cout there,\u201d so urging them to protect it seems pointless. Growing distrust in the government only adds to this sense of resignation. In their view, they have nothing left to lose. They\u2019re not all cybersecurity experts or analysts; they don\u2019t see the risks we deal with day in and day out, and they\u2019re certainly not privacy wonks. For them, it\u2019s just another reason to tune out and give up on the idea of real data protection.\n\nI don\u2019t have any answers, and this is just one person\u2018s opinion, but, yeah.\n        \u003c/div\u003e\n        "}, {"color": "#7f0628", "id": "684", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            I love the idea, but here\u0027s the thing. Despite issues with TOS on Tiktok we still had free speech. They don\u0027t have free speech in China, it is a very stick Communist regime. While I believe it was never about China having our data, I\u0027m not going to hand it to them on a silver platter.\n        \u003c/div\u003e\n        "}, {"color": "#c9caaa", "id": "1714", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            TIL that free speech is given to us by foreign private companies, and if those companies are banned from operating "}, {"color": "#aaa5e8", "id": "383", "label": "Score: 7", "shape": "dot", "size": 30.7, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 7\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            In fairness - the reason for the ban isn\u2019t TikTok selling data: it\u2019s the ability of the Chinese government to manipulate the algorithm to serve specific content e.g propaganda to the American public\n        \u003c/div\u003e\n        "}, {"color": "#604152", "id": "449", "label": "Score: -8", "shape": "dot", "size": 29.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -8\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            I am in my 30s. Letting an authoritarian closed aversarial state not only have access to your information, but being voluntarily subjected to its algorithms, is plain stupid. What other word is there? \n\nThis one-sided openness is just a huge vulnerability and people don\u0027t just walk into it on accident, but voluntarily? Yea, nah, try find a better word for it then.\n\nI guess it is high time Europe/Oceania weens itself off the alliance with the US, as you can\u0027t trust their governments anymore nor can you trust its people as both of them seem to love helping adversaries to spite their domestic opponents. You got the rednecks cozying up to Russia, so their younger more liberal opposition cozies up to China instead. Incredible.\n        \u003c/div\u003e\n        "}, {"color": "#4c4b67", "id": "34", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            While this seems like the common sense explanation it\u2019s actually far more complicated\u2026.\n\nTikTok\u2019s servers are on American soil, which makes the threat to shut it down if they don\u2019t sell a simple matter of jurisdiction. Apple \u0026 Google have no control over that\u2026\n\nRedNote is a 100% based in China so to ban its use Apple \u0026 Google would have to agree to remove it from their app stores. That\u2019s a very unlikely event..not only due to branding values, but also because they spent vast sums breaking into the Chinese market \u0026 have already shown how far they\u2019ll go to prevent upsetting the Chinese government.\n\nWhile a RedNote ban isn\u2019t impossible it won\u2019t be as easy as lawmakers saying boo.\n        \u003c/div\u003e\n        "}, {"color": "#7c6f2a", "id": "2488", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Point completely missed.\u00a0\n\nThis is meant as a massive Fvck You to the US government for censoring only one of all the propaganda/spyware masquerading as social media (looking at Google, Meta, etc)\n        \u003c/div\u003e\n        "}, {"color": "#531125", "id": "737", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            No matter the popularity of a law or ideal, amoungst the 99%, it\u0027s a chance to be law is ~30%. We are so far past being able to convince our government to do things the normal way. They are way too deep in the pockets of the rich. While we are nominally a democracy we are functionally an oligarchy. So the only tools we the people have left are ridiculous protest and violence. And im not apt to the latter.\n        \u003c/div\u003e\n        "}, {"color": "#14f38d", "id": "2970", "label": "Score: 20", "shape" \n        "}, {"color": "#6abf08", "id": "3072", "label": "Score: 0", "shape": "dot", "size": 30.0, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 0\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            \u003eIt is absolutely not hypocritical to want to prevent an adversary foreign state from having the kind of access TikTok does.\n\nIt is when russia was cought doing it, and the platforms involved had no eqivelent repercussions. \n\nDont take this as me saying we shouldn\u0027t be implementing these bans. My point is that it should be all or nothing, or else our government looks like it is weaponizing its justice system to target specific sites, which this bill definitely does. \n\n\u003ebut a TikTok ban might also be a great step in the fight *for* data privacy and rights--it can be used as an example to go after other similar actors, including domestic ones.\n\nThat isn\u0027t happening until the MAGA movement dissipates since they are directly benefitting from it.\n        \u003c/div\u003e\n        "}, {"color": "#5fe0cd", "id": "3171", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Yeah but it isn\u0027t about you. They can use that data in aggregate to manipulate public opinion of American citizens in ways that are detrimental to all of us.\n\n\nOr have you not looked around lately\n        \u003c/div\u003e\n        "}, {"color": "#efafdd", "id": "1567", "label": "Score: 24", "shape": "dot", "size": 32.4, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 24\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            This is what you get when old people in Congress get oddly specific with a ban.\n        \u003c/div\u003e\n        "}, {"color": "#84567a", "id": "2429", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            No its not, so does the Red Note. But both their local governments do have influence on contents to some degree\n        \u003c/div\u003e\n        "}, {"color": "#88c376", "id": "2762", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Compared to Instagram or tiktok or even twitter, reddit is more right wing. Even on musks twitter I still saw people with Palestine flags in bio meanwhile mainstream subreddits are full of hasbara.\n        \u003c/div\u003e\n        "}, {"color": "#a770d7", "id": "511", "label": "Score: 101", "shape": "dot", "size": 40.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 101\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Is it? Is it really? With how incredibly online and connected our modern world is, it\u2019s almost impossible not to have *someone* harvesting your data.\n        \u003c/div\u003e\n        "}, {"color": "#8210f9", "id": "527", "label": "Score: 7", "shape": "dot", "size": 30.7, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 7\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Fair enough, I don\u0027t disagree there at all. Though, I would rather no one having my data instead. The answer to this, of course, is better data protection laws. But we would never do that because the whole point of the tiktok ban was to enable Meta and Google to have a monopoly on our data. This way, american companies can /sell/ the data to the ccp instead of them harvesting it themself.\n        \u003c/div\u003e\n        "}, {"color": "#211976", "id": "2108", "label": "Score: -1", "shape": "dot", "size": 29.9, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            lol I know that may be controversial. If nothing else though it makes our division look better and more competitive.\n        \u003c/div\u003e\n        "}, {"color": "#c46255", "id": "1029", "label": "Score: 57", "shape": "dot", "size": 35.7, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 57\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            The CCP have absolutely no interest in allowing Western users into their local system. They are against the concept of a market of ideas between nations.\n\nThere\u0027s a reason why the great firewall exists. Why do you think China has massively popular domestic products such as Douyin, Weixin, Alipay all of which exist in a seperate ecosystem from the rest of the world.\n\n\nRather then jump to a conspiracy theory, let\u0027s look at the more likely explanation. Both Tiktok and XHS both use algorithms which are heavily reliant on user input. This is likely similar to all the other viral trends you see out there, algorithm driven. The algorithms themselves are likely complex, it\u0027s not easy to drive a specific outcome based on the algorithm though I\u0027m sure general broad strokes might be feasible.\n\n\n\nThey are interested in the political \u0027face\u0027 gain from it, pushing the hypocrisy of America. \u0027Free\u0027 speech as long as it fits my narrative. That\u0027s why you haven\u0027t seen a crackdown yet, it\u0027ll probably be around a month or so away where you see the introduction of mandatory Chinese numbers or a partition of XHS into two sections based on IP\n        \u003c/div\u003e\n        "}, {"color": "#dcd09d", "id": "686", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Unless they do something DRASTIC to the UI/UX I don\u0027t see it taking off with stateside creators.\n        \u003c/div\u003e\n        "}, {"color": "#faab6e", "id": "2844", "label": "Score: 4", "shape": "dot", "size": 30.4, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 4\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Specifically like what, though.\n        \u003c/div\u003e\n        "}, {"color": "#d6cf12", "id": "343", "label": "Score: 50", "shape": "dot", "size": 35.0, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 50\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Cuz my alternative is what? Going to Facebook, Instagram, X (bleh)? The exact course of action they wanted after funneling millions into politicians to make the ban happen? Nah dawg, I\u2019m not feeding into the hypocrisy. The govt can either give the details about what the big danger is cuz all they are saying is \u201ctrust me bro TikTok is dangerous for you\u201d when they have no good faith trust left, or unban the app, or extend the logic of social media threats to ALL the platforms, or accept when the public says F U.\n        \u003c/div\u003e\n        "}, {"color": "#fbfcee", "id": "839", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Supreme court isnt an electoral issue. And increasing the size of the house is less important than the other things. Although im not opposed to it.\n\nIt could be direct vote, but I feel like it would be too hard to get across the line initially. Some states already have ranked choice voting, and some states already have proportional electors. So its workable in the current framework.\n        \u003c/div\u003e\n        "}, {"color": "#6b8d18", "id": "2450", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            \u003eX\n\nAh yes, the place where saying anything bad about Elon gets you shadow banned, removes your blue checkmark, and your messages leaked. A true bastion of free speech.\n        \u003c/div\u003e\n        "}, {"color": "#9cfcb3", "id": "3159", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Not to the extent the CCP\u0027s has.\n        \u003c/div\u003e\n        "}, {"color": "#8a79a1", "id": "1653", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            I wouldn\u0027t exactly call American owned social media government propaganda, I don\u0027t think I need to demonstrate how routine it is to see immense criticism of America\u0027s government, political system and leaders everywhere you go on social media.\n\nI would say the issue is actually the opposite of this. Where anti-institutional populist talking points are radicalizing people against America\u0027s institutions to an excessive degree. \n\nIf you were in China and you say a fraction of the things that you routinely hear being said about Biden, Trump, et. al - you would be disappeared by the government no questions asked. \n\nI\u0027ll wager this, go and criticize American government officials on American-owned social media and go and criticized Chinese government officials on Chinese-owned social media and compare your respective experiences.\n        \u003c/div\u003e\n        "}, {"color": "#d0413d", "id": "1839", "label": "Score: 0", "shape": "dot", "size": 30.0, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 0\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            I can honestly say I don\u0027t care about the free speech angle I just think the US government is trash and whatever they don\u0027t want me to do is probably the most morally correct choice of all\n        \u003c/div\u003e\n        "}, {"color": "#fedc3e", "id": "3041", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            As if we don\u0027t have ALL of that in the US? Every finger you can point at China, we have too.\n        \u003c/div\u003e\n        "}, {"color": "#93f4d4", "id": "1034", "label": "Score: 13", "shape": "dot", "size": 31.3, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 13\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Would you say twitter or Facebook is a national security threat to the US or UK for promoting neo Nazis?\n        \u003c/div\u003e\n        "}, {"color": "#d8061a", "id": "2572", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            [Don\u2019t Stop Til You Get Enough intensifies]\n        \u003c/div\u003e\n        "}, {"color": "#2f1e3e", "id": "854", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            But now something is being done to stop TikTok.\n        \u003c/div\u003e\n        "}, {"color": "#a917b0", "id": "830", "label": "Score: 7", "shape": "dot", "size": 30.7, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 7\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Yes it is.\n\n\u003eMany of them don\u2019t consider the Chinese government to be a threat to them, but do consider the US government to be a threat to them.\n\nAnd can\u0027t fathom how the former is connected to the latter, apparently.\n        \u003c/div\u003e\n        "}, {"color": "#64b498", "id": "188", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Or... he owns another social media app.\n        \u003c/div\u003e\n        "}, {"color": "#a954cf", "id": "2964", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            I can\u0027t protest and criticize Xi Jinping there though\n        \u003c/div\u003e\n        "}, {"color": "#2bc808", "id": "3201", "label": "Score: 6", "shape": "dot", "size": 30.6, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 6\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Western commies never know what it feels like to be detained just because you disagree with the government.\n        \u003c/div\u003e\n        "}, {"color": "#a05062", "id": "3096", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Which terrorists exactly are part owners of X or are you saying all Saudis are terrorists?\u00a0\n\nAre they using it to actively influence Americans as the CCP has been doing? If so ban them too. Any foreign actors that act against the U.S. should be treated harshly. \u00a0\n\nI don\u2019t think this is as much of a gotcha as you may have wanted.\u00a0\n        \u003c/div\u003e\n        "}]);
