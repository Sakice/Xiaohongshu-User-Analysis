            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

ire ethnic group of people being forced into re-education camps. It is frightening how naive Americans are.\n\n\u003e You would be shocked to know that they are just like us\n\nNot the experience I\u0027ve had at all.\n        \u003c/div\u003e\n        "}, {"color": "#91ed33", "id": "160", "label": "Score: -10", "shape": "dot", "size": 29.0, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -10\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            This is not true. No one is going to china\u2019s rednote. Fake story generators are writing fake stories. These are ads\n        \u003c/div\u003e\n        "}, {"color": "#fccfdd", "id": "1730", "label": "Score: 18", "shape": "dot", "size": 31.8, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 18\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            The thing is the US has shown the algorithm targets youth outside of china with moronic challenges and silly dances while in china the algorithm focus on life achievement education so in a way it is a tool against the world youth.\n        \u003c/div\u003e\n        "}, {"color": "#47c522", "id": "113", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Chinese govt: TikTok is dangerous for us!\n\n\nUS govt: No, TikTok is dangerous for us!\n\n\nAmerican people: Fuck it, I\u0027m siding with Xi. Where\u0027s my gun? I got some feet to shoot.\n        \u003c/div\u003e\n        "}, {"color": "#e4b08a", "id": "1457", "label": "Score: 3", "shape": "dot", "size": 30.3, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 3\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            The Beckham comp is valid\n        \u003c/div\u003e\n        "}, {"color": "#b46c3f", "id": "1444", "label": "Score: 5", "shape": "dot", "size": 30.5, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 5\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Its unfortunate because S1G was a higher performing reactor...when the superheater worked. Not to mention the sound silencing benefits that come with being able to pump coolant with magnetic fields coupled with a much lower operating pressure. \nBut that month long wait before entering the reactor compartment was just not simpatico with optempo requirements.\n\n\n\nYeah the alfas basically had to be hooked up to shore steam or just never shut down which made maintenance nothing short of cruel and unusual punishment for any technician unfortunate enough to have to perform it.\n        \u003c/div\u003e\n        "}, {"color": "#7fb303", "id": "1462", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            spy nimaa? ruozhi\n        \u003c/div\u003e\n        "}, {"color": "#cea716", "id": "2508", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Yh, ig it does make a point. But I honestly can\u2019t suggest any app that\u2019s even comparable to TikTok.\n        \u003c/div\u003e\n        "}, {"color": "#3608b1", "id": "2026", "label": "Score: -4", "shape": "dot", "size": 29.6, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -4\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            You think slavery isn\u2019t bad as the border camps? Lol.\n\nFeel like I\u2019m talking to 12 year olds on here.\n        \u003c/div\u003e\n        "}, {"color": "#8641f1", "id": "910", "label": "Score: -15", "shape": "dot", "size": 28.5, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -15\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            China created Coronavirus? Bro get some air. The U.S. has been the most destructive global force the past 70 years.\n        \u003c/div\u003e\n        "}, {"color": "#116b44", "id": "2201", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            You can disallow all the permission pop ups. and as per the Google play store data collection, that counters what you say here.\n        \u003c/div\u003e\n        "}, {"color": "#f00cba", "id": "1924", "label": "Score: -1", "shape": "dot", "size": 29.9, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            I give it a year before we start seeing posts calling for a \"preemptive invasion\" of China.\n        \u003c/div\u003e\n        "}, {"color": "#3b0399", "id": "140", "label": "Score: 49", "shape": "dot", "size": 34.9, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 49\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Why is the data privacy argument at the top? We all know companies from all countries leak, sell, or get robbed of data. My concern is an entertainment platform essentially run and monitored by the Chinese government. I also don\u2019t watch Russia Today or Fox News because I\u2019m not interested in sitting there while propaganda is funneled down my gullet.\n        \u003c/div\u003e\n        "}, {"color": "#331275", "id": "1255", "label": "Score: 2", "shape": "dot", "size": 30.2, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 2\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Are you seriously comparing the civil rights track records of the U.S. and China over the last century? \n\nSure, America has its dark chapters, but we also have systems of accountability, free speech, and progress\u2014things that don\u2019t exist in China.\n\nThey\u2019re running mass surveillance, locking up millions in re-education camps, and crushing dissent with zero oversight. Flaws don\u2019t make the two even remotely comparable.\n\nChina\u2019s Great Leap Forward (1958\u20131962): An estimated 30\u201345 million deaths from famine and political purges, caused directly by government policies.\n\nU.S. Civil Rights Era (1950s\u20131960s): Approximately 41 documented lynchings of Black Americans during this time. Horrific, but incomparable in scale and intent.\n\nOne involves systemic progress and eventual accountability. The other? Decades of unchecked mass atrocities. These numbers alone show they\u2019re not in the same league.\n\nHEY. Isn\u0027t it great we can have this conversation in public? I mean the ignorance is just staggering.\n        \u003c/div\u003e\n        "}, {"color": "#79de44", "id": "408", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Why doesn\u2019t China just release the version that is used in china?\n        \u003c/div\u003e\n        "}, {"color": "#653108", "id": "2111", "label": "Score: 19", "shape": "dot", "size": 31.9, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 19\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Personally I would like to get back into reading actual books and spending more time with friends.\n\nReddit has become more of a habit (and borderline addiction) for me than a pleasure in recent years. I appreciate what a valuable information resource it\u2019s been, of course. But it\u2019s also been a major crutch in terms enabling my tendency to self isolate.\n        \u003c/div\u003e\n        "}, {"color": "#309a25", "id": "845", "label": "Score: 1", "shape": "dot", "size": 30.1, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 1\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            Is this a discussion about which government is \"better\" (US vs China) or about whether the Chinese government is oppressing Uyghurs?\n\nI don\u0027t think there\u0027s any objective way to say which government is \"better\", as different people have different values. But the Chinese government is certainly oppressing Uyghurs. Evidence:\n\n* Guardian [video interview](https://www.theguardian.com/world/video/2020/sep/08/the-memories-never-leave-me-uighur-teacher-describes-forced-sterilisation-video-interview) with an Uighur teacher describing forced sterilization\n* NY Times [report](https://www.nytimes.com/interactive/2019/11/16/world/asia/china-xinjiang-documents.html) on 400+ pages of leaked CCP documents:\u00a0\n* BBC [interview](https://youtu.be/e6bPGl10Cts) with internment camp detainees and even a former guard alleging various forms of mistreatment in the camps\n* NPR [reports](https://www.npr.org/2020/09/24/916665128/report-satellite-images-reveal-suspected-detention-sites-in-chinas-xinjiang-regi) on satellite images of detention centers\u00a0\n\nNone of this means the US is \"better\" than China. The US has its own issues: \n\n* imprisons people at rates greater than essentially any other nation\n* has a history of supporting dictators/coups/etc during the Cold War, leading to e.g. the Iranian revolution (as just one example)\n* has a history of slavery and racism leading into the present day\n        \u003c/div\u003e\n        "}, {"color": "#5913c3", "id": "898", "label": "Score: 0", "shape": "dot", "size": 30.0, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: 0\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            where do all of you gather so much fake news from\n        \u003c/div\u003e\n        "}, {"color": "#ea6ffc", "id": "7", "label": "Score: -6", "shape": "dot", "size": 29.4, "title": "\n        \u003cdiv style=\u0027max-width:400px; white-space:normal; font-size:12px;\u0027\u003e\n            \u003cb\u003eScore: -6\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n            The US government will eventually catch wind and ban RedNote too. It\u2019s inevitable.\n        \u003c/div\u003e\n        "}]);
